# The ingestion worker can reach the internet only through this proxy. Squid
# resolves the destination and applies destination-IP ACLs at connection time,
# so DNS rebinding cannot turn an allowlisted hostname into an internal dial.
http_port 3128
visible_hostname gameintel-egress

cache deny all
forwarded_for delete
request_header_access X-Forwarded-For deny all

acl allowed_domains dstdomain "/etc/squid/allowed-domains.acl"
acl blocked_destinations dst "/etc/squid/blocked-destinations.acl"
acl safe_ports port 80
acl safe_ports port 443
acl ssl_ports port 443
acl connect method CONNECT

http_access deny !safe_ports
http_access deny connect !ssl_ports
http_access deny blocked_destinations
http_access allow allowed_domains
http_access deny all
