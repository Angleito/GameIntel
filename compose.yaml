services:
  postgres:
    image: pgvector/pgvector:pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gameintel}
      POSTGRES_USER: ${POSTGRES_USER:-gameintel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [database]

  migrate:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    command: ["bun", "run", "scripts/migrate.ts"]
    environment:
      MIGRATION_DATABASE_URL: "postgres://${POSTGRES_USER:-gameintel}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-gameintel}"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks: [database]

  bootstrap-runtime-role:
    image: pgvector/pgvector:pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
    command:
      - sh
      - -ec
      - >-
        test "$$APP_DATABASE_USER" != "$$POSTGRES_USER";
        until pg_isready -h postgres -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"; do sleep 1; done;
        psql -v ON_ERROR_STOP=1 -h postgres -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
        -v app_user="$$APP_DATABASE_USER" -v app_password="$$APP_DATABASE_PASSWORD"
        -f /bootstrap/bootstrap-runtime-role.sql
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-gameintel}
      POSTGRES_USER: ${POSTGRES_USER:-gameintel}
      APP_DATABASE_USER: ${APP_DATABASE_USER:-gameintel_app}
      APP_DATABASE_PASSWORD: ${APP_DATABASE_PASSWORD:?Set APP_DATABASE_PASSWORD in .env}
    volumes:
      - ./infra/postgres/bootstrap-runtime-role.sql:/bootstrap/bootstrap-runtime-role.sql:ro
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: "no"
    networks: [database]

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    environment:
      API_PORT: ${API_PORT:-3000}
      DATABASE_URL: "postgres://${APP_DATABASE_USER:-gameintel_app}:${APP_DATABASE_PASSWORD:?Set APP_DATABASE_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-gameintel}"
      GAMEINTEL_PROFILE: ${GAMEINTEL_PROFILE:-gta-vi}
      LOCAL_OPERATOR_TOKEN: ${LOCAL_OPERATOR_TOKEN:?Set LOCAL_OPERATOR_TOKEN in .env}
      OPERATOR_ID: ${OPERATOR_ID:-local-operator}
      PUBLIC_SUBMISSIONS_ENABLED: ${PUBLIC_SUBMISSIONS_ENABLED:-false}
      SUBMISSION_TRUST_PROXY: ${SUBMISSION_TRUST_PROXY:-false}
      SUBMISSION_TRUSTED_IP_HEADER: ${SUBMISSION_TRUSTED_IP_HEADER:-cf-connecting-ip}
      SUBMISSION_IDENTITY_SECRET: ${SUBMISSION_IDENTITY_SECRET:-}
      OPENCODE_AGENT: ${OPENCODE_AGENT:-research-writer}
      OPENCODE_ENABLED: ${OPENCODE_ENABLED:-false}
      OPENCODE_MODEL: ${OPENCODE_MODEL:-openai/gpt-5.6-luna}
      OPENCODE_URL: ${OPENCODE_URL:-http://host.docker.internal:4096}
      OPENCODE_USERNAME: ${OPENCODE_USERNAME:-}
      OPENCODE_PASSWORD: ${OPENCODE_PASSWORD:-}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:4321}
    ports:
      - "127.0.0.1:${API_PORT:-3000}:${API_PORT:-3000}"
    depends_on:
      postgres:
        condition: service_healthy
      bootstrap-runtime-role:
        condition: service_completed_successfully
    networks: [database]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    pids_limit: 128
    mem_limit: 512m
    restart: unless-stopped

  scheduler:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    command: ["bun", "run", "services/newsroom/src/scheduler.ts"]
    environment:
      DATABASE_URL: "postgres://${APP_DATABASE_USER:-gameintel_app}:${APP_DATABASE_PASSWORD:?Set APP_DATABASE_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-gameintel}"
      GAMEINTEL_PROFILE: ${GAMEINTEL_PROFILE:-gta-vi}
      SCHEDULER_POLL_MS: ${SCHEDULER_POLL_MS:-10000}
    depends_on:
      postgres:
        condition: service_healthy
      bootstrap-runtime-role:
        condition: service_completed_successfully
    networks: [database]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    pids_limit: 128
    mem_limit: 256m
    restart: unless-stopped

  ingest-worker:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    command: ["bun", "run", "services/newsroom/src/worker.ts"]
    environment:
      DATABASE_URL: "postgres://${APP_DATABASE_USER:-gameintel_app}:${APP_DATABASE_PASSWORD:?Set APP_DATABASE_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-gameintel}"
      GAMEINTEL_PROFILE: ${GAMEINTEL_PROFILE:-gta-vi}
      GAMEINTEL_FETCH_WORKER: "true"
      INGESTION_WORKER_ID: ${INGESTION_WORKER_ID:-source-ingest-1}
      SOURCE_FETCH_PROXY_URL: http://egress-proxy:3128
      OPENCODE_ENABLED: "false"
      INGESTION_WORKER_POLL_MS: ${INGESTION_WORKER_POLL_MS:-500}
    depends_on:
      postgres:
        condition: service_healthy
      bootstrap-runtime-role:
        condition: service_completed_successfully
      egress-proxy:
        condition: service_started
    networks: [database, ingestion]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    pids_limit: 128
    mem_limit: 512m
    restart: unless-stopped

  egress-proxy:
    image: ubuntu/squid:6.6-24.04_beta@sha256:6a097f68bae708cedbabd6188d68c7e2e7a38cedd05a176e1cc0ba29e3bbe029
    volumes:
      - ./infra/egress/squid.conf:/etc/squid/squid.conf:ro
      - ./infra/egress/allowed-domains.acl:/etc/squid/allowed-domains.acl:ro
      - ./infra/egress/blocked-destinations.acl:/etc/squid/blocked-destinations.acl:ro
    networks: [ingestion, outbound]
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [SETGID, SETUID]
    pids_limit: 128
    mem_limit: 256m
    restart: unless-stopped

networks:
  database:
    internal: true
  ingestion:
    internal: true
  outbound: {}

volumes:
  postgres-data:
